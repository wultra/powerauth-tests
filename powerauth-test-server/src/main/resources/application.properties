# Enrollment service URL
powerauth.enrollment.service.url=${POWERAUTH_TEST_SERVER_ENROLLMENT_SERVER_URL:http://localhost:8080/enrollment-server}

# PowerAuth protocol version
powerauth.version=${POWERAUTH_TEST_SERVER_POWERAUTH_VERSION:4.0}

# Bouncy Castle initialization
bouncycastle.provider.initialization.enabled=true

# Store result status in memory
resultstatus.persistenceType=${POWERAUTH_TEST_SERVER_RESULT_STATUS_PERSISTENCE_TYPE:memory}

# Default H2 database configuration for tests
#spring.h2.console.enabled=false
#spring.h2.console.path=/h2
#spring.datasource.url=jdbc:h2:file:~/powerauth-test;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
#spring.datasource.username=sa
#spring.datasource.password=

# PostgreSQL configuration
spring.datasource.url=${POWERAUTH_TEST_SERVER_DATASOURCE_URL:jdbc:postgresql://localhost:5432/powerauth}
spring.datasource.username=${POWERAUTH_TEST_SERVER_DATASOURCE_USERNAME:powerauth}
spring.datasource.password=${POWERAUTH_TEST_SERVER_DATASOURCE_PASSWORD:}
spring.datasource.hikari.pool-name=HikariPool-Test-Server
spring.datasource.hikari.maximumPoolSize=${POWERAUTH_TEST_SERVER_DATASOURCE_POOL_SIZE:5}
spring.datasource.hikari.connectionTimeout=${POWERAUTH_TEST_SERVER_DATASOURCE_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idleTimeout=${POWERAUTH_TEST_SERVER_DATASOURCE_MAX_IDLE:600000}
spring.datasource.hikari.maxLifetime=${POWERAUTH_TEST_SERVER_DATASOURCE_MAX_AGE:1800000}
spring.jpa.properties.hibernate.connection.CharSet=${POWERAUTH_TEST_SERVER_JPA_CHARSET:UTF-8}
spring.jpa.properties.hibernate.connection.characterEncoding=${POWERAUTH_TEST_SERVER_JPA_CHARACTER_ENCODING:UTF-8}
spring.jpa.properties.hibernate.connection.useUnicode=${POWERAUTH_TEST_SERVER_JPA_USE_UNICODE:true}
server.port=8081

# Hibernate Configuration - automatically update DB schema
spring.jpa.hibernate.ddl-auto=${POWERAUTH_TEST_SERVER_JPA_DDL_AUTO:update}

# Disable open session in view to avoid startup warning of Spring boot
spring.jpa.open-in-view=false

spring.application.name=powerauth-test-server

banner.application.name=${spring.application.name}
banner.application.version=@project.version@

logging.config=${POWERAUTH_TEST_SERVER_LOGGING:}

# Liquibase
spring.liquibase.enabled=${LIQUIBASE_ENABLED:false}
spring.liquibase.parameters.pa-cloud-service-base-url=${POWERAUTH_CLOUD_SERVICE_BASE_URL:}
spring.liquibase.parameters.pa-cloud-admin-username=${POWERAUTH_CLOUD_ADMIN_USERNAME:}
spring.liquibase.parameters.pa-cloud-admin-password-encoded=${POWERAUTH_CLOUD_ADMIN_PASSWORD_ENCODED:}

# Monitoring
management.tracing.sampling.probability=1.0
